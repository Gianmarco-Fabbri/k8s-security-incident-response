apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnapp
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: vulnapp
  template:
    metadata:
      labels:
        app: vulnapp
    spec:
      # Deliberately enabled for the token-theft exercise. Never copy this
      # setting to an application that does not need Kubernetes API access.
      automountServiceAccountToken: true
      containers:
        - name: vulnapp
          image: vulnapp:lab-v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # No liveness restart: an isolated pod may contain volatile evidence.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
