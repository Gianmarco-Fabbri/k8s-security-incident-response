# Copy this file outside the repository and replace CHANGE_ME with the same
# random value stored in the falco-handler-auth Secret.
tty: true

driver:
  kind: modern_ebpf

# Required by the upstream Falcosidekick ingress policy below.
hostNetwork: false

falcosidekick:
  enabled: true
  config:
    webhook:
      address: "http://falco-handler.default.svc.cluster.local:80/"
      customHeaders: "X-Falco-Token:CHANGE_ME"
      minimumpriority: "notice"

customRules:
  lab-rules.yaml: |-
    - rule: Detect Network Tools in vulnapp
      desc: Detect network download utilities executed in the lab target
      condition: >
        spawned_process and container
        and container.image.repository = "vulnapp"
        and proc.name in (wget, curl, ncat, nc, netcat)
      output: >
        Network download tool executed in vulnapp
        (user=%user.name command=%proc.cmdline container=%container.name
        image=%container.image.repository pod=%k8s.pod.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [network, mitre_execution, T1105]

    - macro: user_known_contact_k8s_api_server_activities
      condition: (container.image.repository = "falco-handler")
