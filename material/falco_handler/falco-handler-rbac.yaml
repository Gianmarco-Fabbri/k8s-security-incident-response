apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-handler
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-pod-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-handler-pod-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: falco-handler
    namespace: default
roleRef:
  kind: Role
  name: falco-pod-manager
  apiGroup: rbac.authorization.k8s.io
