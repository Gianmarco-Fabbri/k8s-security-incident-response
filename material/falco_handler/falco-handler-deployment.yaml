apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-handler
  labels:
    app: falco-handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-handler
  template:
    metadata:
      labels:
        app: falco-handler
    spec:
      serviceAccountName: falco-handler
      containers:
        - name: falco-handler
          image: falco-handler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
