<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDiag — Network Diagnostic Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
        }
        .container {
            width: 100%;
            max-width: 640px;
        }
        .header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #58a6ff;
            letter-spacing: 0.05em;
        }
        .header p {
            font-size: 0.82rem;
            color: #8b949e;
            margin-top: 4px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            padding: 8px 20px;
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .output-box {
            margin-top: 24px;
        }
        .output-box h3 {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
        }
        pre {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #3fb950;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 60px;
        }
        .footer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #484f58;
            border-top: 1px solid #30363d;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#127760; NetDiag &mdash; Network Diagnostic Tool</h1>
            <p>Internal network utility &bull; v1.0.0</p>
        </div>

        <form method="POST" action="/">
            <label for="host">Hostname or IP address</label>
            <div class="input-row">
                <input
                    type="text"
                    id="host"
                    name="host"
                    placeholder="e.g. 8.8.8.8 or google.com"
                    autofocus
                    autocomplete="off"
                >
                <button type="submit">Ping</button>
            </div>
        </form>

        {% if output is not none %}
        <div class="output-box">
            <h3>Output</h3>
            <pre>{{ output if output else "(no output)" }}</pre>
        </div>
        {% endif %}

        <div class="footer">
            Running inside a containerized environment &bull; For internal use only
        </div>
    </div>
</body>
</html>
